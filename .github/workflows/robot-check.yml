      - name: Get changed Robot Framework lines
        shell: bash
        run: |
          git diff \
            --unified=0 \
            --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- '*.robot' '*.resource' \
            > robot_changes.diff

          echo "============================================================"
          echo "Changed Robot Framework Lines"
          echo "============================================================"

          if [ ! -s robot_changes.diff ]; then
            echo ""
            echo "No changed .robot or .resource lines detected."
            echo ""
            echo "============================================================"
            exit 0
          fi

          python - <<'PY'
          import re
          from pathlib import Path

          diff = Path("robot_changes.diff").read_text(
              encoding="utf-8",
              errors="replace"
          )

          current_file = None
          new_line_number = None
          total = 0

          for line in diff.splitlines():

              if line.startswith("+++ b/"):
                  current_file = line[6:]
                  print()
                  print(f"File: {current_file}")
                  print()
                  continue

              if line.startswith("@@"):
                  match = re.search(r"\+(\d+)(?:,(\d+))?", line)

                  if match:
                      new_line_number = int(match.group(1))

                  continue

              if current_file is None or new_line_number is None:
                  continue

              # Added line
              if line.startswith("+") and not line.startswith("+++"):
                  content = line[1:]

                  # Don't clutter output with empty added lines
                  if content.strip():
                      print(
                          f"  Line {new_line_number}: "
                          f"{content.strip()}"
                      )
                      total += 1

                  new_line_number += 1
                  continue

              # Removed line does not exist in the new file,
              # so it does not increment the new-side line number.
              if line.startswith("-") and not line.startswith("---"):
                  continue

              # Context line
              if not line.startswith("\\"):
                  new_line_number += 1

          print()
          print("============================================================")
          print(f"{total} changed line(s) displayed.")
          print("============================================================")
          PY