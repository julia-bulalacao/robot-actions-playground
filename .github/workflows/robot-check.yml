name: QA-A PR Checks

on:
  pull_request:

jobs:
  robot-dry-run:
    name: Robot Dry Run
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Robot Framework dry run
        run: robot --dryrun tests/

  qa-code-quality:
    name: QA-A Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get changed Robot Framework lines
        shell: bash
        run: |
          git diff \
            --unified=0 \
            --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- '*.robot' '*.resource' \
            > robot_changes.diff

          echo "Robot Framework PR changes:"

          if [ -s robot_changes.diff ]; then
            cat robot_changes.diff
          else
            echo "No changed .robot or .resource lines."
          fi

      - name: Run QA-A Code Quality checks
        shell: bash
        run: |
          if [ -s robot_changes.diff ]; then
            python .github/scripts/qa_code_quality.py --diff robot_changes.diff
          else
            echo "No changed .robot or .resource lines."
            echo "QA-A Code Quality check skipped."
          fi